<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Theme Preview</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Inter,system-ui,sans-serif;
    color:#1f2937;
    background:linear-gradient(180deg,#00ddff,#00c6f2);
    transition:background .25s;
}

.card{
    width:460px;
    background:#fff;
    border-radius:22px;
    overflow:hidden;
    box-shadow:
        0 10px 30px rgba(0,0,0,.05),
        0 1px 2px rgba(0,0,0,.04);
}

.header{
    padding:26px 30px 18px;
    border-bottom:1px solid #f1f1f1;
}

.header h2{
    margin:0;
    display:flex;
    align-items:center;
    gap:12px;
    font-size:28px;
}

.nav-logo{
    display:block;
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 30px;
    cursor:pointer;
    transition:background .18s;
}

.item:hover{
    background:var(--theme-hover);
}

.left{
    display:flex;
    align-items:center;
    gap:16px;
}

.check{
    width:18px;
    color:#999;
    font-weight:300;
}

.dot{
    width:22px;
    height:22px;
    border-radius:50%;
}

.name{
    width:90px;
}

.code{
    font-family:monospace;
    color:#8a8f98;
}
</style>

</head>

<body>

<div class="card">

    <div class="header">
        <h2>
            <img
                id="themeLogo"
                class="nav-logo"
                src="img/logo_blue.png"
                width="50"
                height="50"
            >
            Theme
        </h2>
    </div>

    <div id="list"></div>

</div>

<script>

const themes=[
    ["blue","Blue","#00d2ff","#00ddff","#00c6f2","#dff9ff"],
    ["teal","Teal","#00d2cc","#1addd7","#00c2bc","#dff9f8"],
    ["green","Green","#00d200","#11de11","#00c200","#dff9df"],
    ["yellow","Yellow","#ffc200","#ffd11a","#f2b800","#fff8df"],
    ["orange","Orange","#ffa211","#ffb32c","#f29400","#fff0df"],
    ["red","Red","#ff7266","#ff8479","#f26659","#ffe6e3"],
    ["pink","Pink","#ff72bb","#ff86c6","#f264ae","#ffe5f2"],
    ["purple","Purple","#bb92ff","#c8a5ff","#af84f2","#eee6ff"],
    ["brown","Brown","#cca299","#d7b1a9","#c0948b","#f3e9e6"],
    ["slate","Slate","#aab2bb","#b8c0c8","#9da6af","#edf0f2"]
];

const list=document.getElementById("list");
const logo=document.getElementById("themeLogo");

let active=0;

function render(){

    list.innerHTML="";

    themes.forEach((t,i)=>{

        const d=document.createElement("div");

        d.className="item";

        d.innerHTML=`
            <div class="left">
                <div class="check">${i===active?"✓":""}</div>
                <div class="dot" style="background:${t[2]}"></div>
                <div class="name">${t[1]}</div>
            </div>

            <div class="code">${t[2].toUpperCase()}</div>
        `;

        d.onclick=()=>{

            active=i;

            document.body.style.background=
                `linear-gradient(180deg,${t[3]},${t[4]})`;

            document.documentElement.style.setProperty(
                "--theme-hover",
                t[5]
            );

            logo.src=`img/logo_${t[0]}.png`;

            render();

        };

        list.appendChild(d);

    });

}


/* =========================
   INITIAL THEME
========================= */

document.documentElement.style.setProperty(
    "--theme-hover",
    themes[0][5]
);

render();

</script>

</body>
</html>
