<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact™ - For Easy Contact</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="style.css">
<script src="index.js"></script>
<script async data-id="101507669" src="//static.getclicky.com/js"></script>
</head>
<body data-page="dash" data-active-nav="inbox">

<header class="navbar">
  <div class="nav-left">
    <img src="img/logo_blue.png" class="nav-logo" data-animate="true">
    <img src="img/contact_logo_en.png" class="logo-image" onclick="scrollToCategory('hero')">
  </div>

  <div id="desktop-nav" class="nav-center">
    <div class="nav-indicator"></div>
    <a class="nav-link" data-section="inbox" href="inbox.html">
      <img class="nav-icon" src="img/nav_inbox.png"><span class="nav-text">Inbox</span></a>
    <a class="nav-link" data-section="contacts" href="contacts.html">
      <img class="nav-icon" src="img/nav_contacts.png"><span class="nav-text">Contacts</span></a>
    <a class="nav-link" data-section="meetings" href="../meetings">
      <img class="nav-icon" src="img/nav_meetings.png"><span class="nav-text">Meetings</span></a>
    <a class="nav-link" data-section="answer" href="../answer">
      <img class="nav-icon" src="img/nav_answer.png"><span class="nav-text">Answer</span></a>
    <a class="nav-link" data-section="deals" href="../deals">
      <img class="nav-icon" src="img/nav_deals.png"><span class="nav-text">Deals</span></a>
    <a class="nav-link" data-section="card" href="../card">
      <img class="nav-icon" src="img/nav_card.png"><span class="nav-text">Card</span></a>
  </div>

<div class="nav-right">
  <!-- Notifications -->
  <button class="nav-notifications" aria-label="Notifications">
    <img src="img/nav_notifications.png" alt="">
    <span class="notification-dot"></span>
  </button>

  <!-- Upgrade -->
  <a href="upgrade" class="nav-upgrade">
    ✨Upgrade
  </a>

  <!-- Avatar -->
  <div class="avatar-wrapper">
    <button class="avatar-button" id="avatar-button" aria-label="Account menu">
      <span class="avatar-status"></span>
      <img src="img/avatar.png" class="avatar-image" alt="Avatar">
    </button>
    <!-- Avatar Menu -->
    <div class="avatar-menu" id="avatar-menu">
      <!-- Profile -->
      <div class="avatar-menu-profile">
        <div class="profile-avatar-wrap">
          <img src="img/avatar.png" class="profile-avatar" alt="Avatar">
          <span class="profile-status"></span>
        </div>
        <div class="profile-info">
          <div class="profile-name-row">
            <span class="profile-name editable-name" tabindex="0">
              Display name
            </span>
          </div>
          <button class="profile-email" type="button">
            username@livemail.me
          </button>
        </div>
      </div>

      <!-- Availability -->
      <div class="availability-row">

        <span class="availability-label">
          Availability
        </span>

        <button class="availability-button" type="button">
          <span class="availability-indicator status-on"></span>
          <span>ON</span>
          <span class="availability-chevron">⌄</span>
        </button>

        <div class="availability-menu">
          <button data-status="on">
            <span class="availability-indicator status-on"></span>
            ON
          </button>
          <button data-status="away">
            <span class="availability-indicator status-away"></span>
            Away
          </button>
          <button data-status="busy">
            <span class="availability-indicator status-busy"></span>
            Busy
          </button>
          <button data-status="dnd">
            <span class="availability-indicator status-dnd"></span>
            DND
          </button>
          <button data-status="off">
            <span class="availability-indicator status-off"></span>
            OFF
          </button>
        </div>
      </div>

      <div class="avatar-menu-divider"></div>

      <!-- Main actions -->
      <a href="upgrade" class="avatar-menu-item upgrade-item">
        <img src="img/menu_upgrade.png" class="avatar-menu-icon">
        <span>Upgrade</span>
      </a>

      <a href="invite" class="avatar-menu-item">
        <img src="img/menu_invite.png" class="avatar-menu-icon">
        <span>Invite</span>
      </a>

      <div class="avatar-menu-divider"></div>

      <a href="settings" class="avatar-menu-item">
        <img src="img/menu_settings.png" class="avatar-menu-icon">
        <span>Settings</span>
      </a>

      <div class="avatar-menu-divider"></div>

      <a href="feedback" class="avatar-menu-item">
        <img src="img/menu_feedback.png" class="avatar-menu-icon">
        <span>Feedback</span>
      </a>

      <a href="help" class="avatar-menu-item">
        <img src="img/menu_help.png" class="avatar-menu-icon">
        <span>Help</span>
      </a>

      <div class="avatar-menu-divider"></div>

      <a href="privacy" class="avatar-menu-item">
        <img src="img/menu_privacy.png" class="avatar-menu-icon">
        <span>Privacy</span>
      </a>

      <a href="terms" class="avatar-menu-item">
        <img src="img/menu_terms.png" class="avatar-menu-icon">
        <span>Terms</span>
      </a>

      <div class="avatar-menu-divider"></div>

      <a href="logout" class="avatar-menu-item logout-item">
        <img src="img/menu_logout.png" class="avatar-menu-icon">
        <span>Log out</span>
      </a>
    </div>
  </div>

  <!-- Mobile hamburger -->
  <div id="hamburger">
    <span></span>
    <span></span>
    <span></span>
  </div>

</div>
</header>

<!-- Mobile Menu -->
<div id="mobile-menu">
  <a class="nav-link" data-section="inbox" href="../inbox"><img class="nav-icon" src="img/nav_inbox.png"><span class="nav-text">Inbox</span></a>
  <a class="nav-link" data-section="contacts" href="../contacts"><img class="nav-icon" src="img/nav_contacts.png"><span class="nav-text">Contacts</span></a>
  <a class="nav-link" data-section="meetings" href="../meetings"><img class="nav-icon" src="img/nav_meetings.png"><span class="nav-text">Meetings</span></a>
  <a class="nav-link" data-section="answer" href="../answer"><img class="nav-icon" src="img/nav_answer.png"><span class="nav-text">Answer</span></a>
  <a class="nav-link" data-section="deals" href="../deals"><img class="nav-icon" src="img/nav_deals.png"><span class="nav-text">Deals</span></a>
  <a class="nav-link" data-section="card" href="../card"><img class="nav-icon" src="img/nav_card.png"><span class="nav-text">Card</span></a>
</div>

<!-- Inbox Section -->
<h1>inbox</h1>
<div class="divider"></div>
<div class="subtitle">AI drafts first. You stay in control.</div>
<div class="table-wrapper">
</div>

</body>
</html>
